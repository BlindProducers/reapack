name: index

on:
  push:
    branches: [main]
  pull_request:

# One run at a time per branch, so two pushes never commit index.xml at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # On push, take the branch's latest commit rather than the pushed one, so a
          # run that waited for another sees the index.xml commit that run made.
          ref: ${{ github.event_name == 'push' && github.ref || '' }}

      - name: Install Pandoc
        run: sudo apt-get update -qq && sudo apt-get install -yqq pandoc

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install reapack-index
        run: gem install --no-document reapack-index

      - name: Check packages
        run: reapack-index --check

      - name: Update index.xml
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          reapack-index --commit
          git pull --rebase --quiet
          git push
